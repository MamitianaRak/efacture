# Render Blueprint: one Docker web service serving the Angular app and the API.
# The PostgreSQL database is external (Neon free tier does not expire); fill in its values in the Render dashboard.
services:
  - type: web
    name: efacture
    runtime: docker
    plan: free
    region: frankfurt        # same region as the Neon database (AWS eu-central-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false          # jdbc:postgresql://<host>/<database>?sslmode=require
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true  # random 256-bit value generated by Render
      - key: DEMO_USERS
        value: "true"
      # LLM providers for reading supplier invoices; without them the rest of the app still works.
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # The full Factur-X validator does not fit in 512 MB next to the application.
      - key: SIMULATOR_VALIDATE_FILES
        value: "false"
