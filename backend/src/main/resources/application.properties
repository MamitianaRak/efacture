spring.application.name=efacture

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/efacture}
spring.datasource.username=${DATABASE_USER:efacture}
spring.datasource.password=${DATABASE_PASSWORD:efacture}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# JWT signing key (HS256, at least 32 bytes). The default is for local development only:
# set JWT_SECRET in any deployed environment.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.jwt.ttl=8h

# One demo account per role (gerant@demo.fr, comptable@demo.fr).
app.demo-users.enabled=${DEMO_USERS:true}
app.demo-users.password=${DEMO_PASSWORD:demo1234}
