spring.application.name=efacture
# Local secrets (API keys) live in backend/.env, which git ignores.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/efacture}
spring.datasource.username=${DATABASE_USER:efacture}
spring.datasource.password=${DATABASE_PASSWORD:efacture}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# JWT signing key (HS256, at least 32 bytes). The default is for local development only:
# set JWT_SECRET in any deployed environment.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.jwt.ttl=8h

# One demo account per role (gerant@demo.fr, comptable@demo.fr).
app.demo-users.enabled=${DEMO_USERS:true}
app.demo-users.password=${DEMO_PASSWORD:demo1234}

# Simulated registered platform: one step every 5 seconds, 10 % technical rejections, 20 % buyer refusals.
app.platform.simulator.scheduled=true
app.platform.simulator.delay=PT5S
app.platform.simulator.rejection-rate=0.1
app.platform.simulator.refusal-rate=0.2
# Full Factur-X validation of each submitted file (memory-hungry: turned off on 512 MB hosting).
app.platform.simulator.validate-files=${SIMULATOR_VALIDATE_FILES:true}

# LLM gateway: providers, then for each lane the candidates tried in order ("provider:model").
# A provider without a key is skipped; tests and CI run with no key at all.
app.llm.timeout=PT30S
app.llm.providers.groq.base-url=https://api.groq.com/openai/v1
app.llm.providers.groq.api-key=${GROQ_API_KEY:}
app.llm.providers.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
app.llm.providers.gemini.api-key=${GOOGLE_API_KEY:}
app.llm.lanes.fast=groq:openai/gpt-oss-20b,gemini:gemini-3.5-flash-lite
app.llm.lanes.reasoning=gemini:gemini-3.5-flash,groq:openai/gpt-oss-120b
app.llm.lanes.document=gemini:gemini-3.5-flash
